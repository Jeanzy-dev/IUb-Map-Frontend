<header class="header">
  <div class="brand">
    <img src="images/icono-iub-map.png" alt="IUB MAP" class="logo-header" />
  </div>

  <form class="search-header" [formGroup]="salonForm">
    <svg class="icon icon-search" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>

      <line x1="16" y1="16" x2="21" y2="21"></line>
    </svg>

    <input
      type="text"
      #inputSalon
      placeholder="Buscar salón, edificio o servicio"
      formControlName="nombreSalon"
    />
    <button class="search-button" (click)="buscarEspacio(inputSalon.value)">
      Buscar
    </button>
  </form>

  <div class="usuario">
    <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="8" r="4"></circle>

      <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
    </svg>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <nav class="menu">
      <button class="active">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"></path>

          <path d="M9 3v15"></path>

          <path d="M15 6v15"></path>
        </svg>

        <span> Mapa </span>
      </button>
      @if (isAdmin) {
      <button class="active" (click)="newUsuario()">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"></path>

          <path d="M9 3v15"></path>

          <path d="M15 6v15"></path>
        </svg>

        <span> Nuevo usuario </span>
      </button>
      }
      <button class="active" (click)="logout()">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <!-- Icono de salida / cerrar sesión -->
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>

        <span> Cerrar sesión </span>
      </button>

      <!-- <button class="active">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>

        <span> cerrar sesion </span>
      </button> -->
    </nav>
  </aside>
