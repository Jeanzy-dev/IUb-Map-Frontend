<div class="login-container">
  <div class="brand-header">
    <h1 class="brand-title">IUB <span>MAP</span></h1>
    <p class="brand-subtitle">Navega tu universidad</p>
  </div>

  <form >
    <div class="form-group">
      <label for="username">Usuario</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Ingresa tu usuario"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        required
      />
    </div>

    <button type="submit" class="btn-submit">
      Iniciar sesión
    </button>
  </form>

  <p class="footer-text">© 2026 IUB MAP. Todos los derechos reservados.</p>
</div>
